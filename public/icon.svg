<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The site's own identity mark: the header's brass specimen
       diamond, drawn at favicon scale. Paper ground, brass-ink rule,
       brass fill at the same 30% the header uses. -->
  <rect width="32" height="32" fill="#F6F4ED"/>
  <g transform="rotate(45 16 16)">
    <rect x="8.5" y="8.5" width="15" height="15" fill="#B18B5D" fill-opacity="0.3" stroke="#755A35" stroke-width="1.6"/>
  </g>
</svg>
